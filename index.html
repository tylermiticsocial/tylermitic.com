<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tyler Mitic</title>
    <meta name="description" content="Tyler Mitic" />
    <meta property="og:title" content="Tyler Mitic" />
    <meta property="og:url" content="https://tylermitic.com" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f6f1e7;
        --ink: #1d1a16;
        --muted: #6b6357;
        --accent: #b0421d;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14120f;
          --ink: #efe8da;
          --muted: #9d9486;
          --accent: #ee8b5f;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font: 1.125rem/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 30rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-family: ui-serif, 'New York', Georgia, serif;
        font-size: clamp(2.5rem, 10vw, 3.5rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 2rem;
        color: var(--muted);
      }

      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        color: var(--ink);
        text-decoration-color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.25em;
      }

      a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tyler Mitic</h1>

      <!-- Change this line to say whatever you like. -->
      <p>Welcome to my corner of the internet.</p>

      <!-- Add or remove links here. -->
      <ul>
        <li><a href="https://tylerstandem.com">Tyler’s Tandem</a></li>
        <li><a href="https://instagram.com/tylermitic">Instagram</a></li>
        <li><a href="mailto:tyler@tylermitic.com">Email</a></li>
      </ul>
    </main>
  </body>
</html>
